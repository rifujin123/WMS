# CI/CD — build + test + lint cho WMS
#
# 1. CI: Chạy song song backend (build + test) và frontend (lint + build) trên mọi push/PR.
# 2. CD: Chỉ khi CẢ HAI job trên đều PASS và commit thuộc nhánh master/main, mới trigger Render Deploy Hook.

name: CI/CD Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/WMS-mini
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore WMS.sln

      # -m:1 (single MSBuild node) để tránh lỗi tương tranh node trên một số runner.
      - name: Build
        run: dotnet build WMS.sln --no-restore -m:1

      - name: Test
        run: dotnet test WMS.sln --no-build -m:1

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Render
    needs: [backend, frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Backend Deploy Hook
        env:
          HOOK_API: ${{ secrets.RENDER_API_DEPLOY_HOOK || secrets.RENDER_BACKEND_DEPLOY_HOOK || secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK_API" ]; then
            echo "🚀 Triggering Render Backend Deploy..."
            curl -fsS -X POST "$HOOK_API"
            echo "✅ Backend deploy triggered successfully."
          else
            echo "⚠️ Secret RENDER_API_DEPLOY_HOOK not configured. Skipping backend webhook."
          fi

      - name: Trigger Render Frontend Deploy Hook
        env:
          HOOK_WEB: ${{ secrets.RENDER_WEB_DEPLOY_HOOK || secrets.RENDER_FRONTEND_DEPLOY_HOOK || secrets.RENDER_DEPLOY_HOOK_WEB }}
        run: |
          if [ -n "$HOOK_WEB" ]; then
            echo "🚀 Triggering Render Frontend Deploy..."
            curl -fsS -X POST "$HOOK_WEB"
            echo "✅ Frontend deploy triggered successfully."
          else
            echo "⚠️ Secret RENDER_WEB_DEPLOY_HOOK not configured. Skipping frontend webhook."
          fi
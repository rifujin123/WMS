# CI — build + test + lint cho WMS
#
# Chạy backend (build + test) và frontend (lint + build) trên mỗi push/PR tới nhánh chính.
# Không cần secret: chỉ dùng config mẫu, không khởi động DB thật.

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/WMS-mini
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore WMS.sln

      # -m:1 (single MSBuild node) để tránh lỗi tương tranh node trên một số runner.
      - name: Build
        run: dotnet build WMS.sln --no-restore -m:1

      - name: Test
        run: dotnet test WMS.sln --no-build -m:1

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build